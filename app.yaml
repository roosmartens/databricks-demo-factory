command:
  - gunicorn
  - --config
  - app/gunicorn.conf.py
  - app.main:app

env:
  - name: DATA_BACKEND
    value: databricks
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Forecast accuracy page reads gold_forecast_accuracy from the same schema.
  # Inventory copilot (notebooks/grocery_copilot_lakehouse.py)
  - name: DATABRICKS_COPILOT_SCHEMA
    value: workspace.grocery_copilot
  # Optional: uncomment once the index and a chat endpoint exist; the app falls back to offline mode on errors.
  # - name: COPILOT_VECTOR_INDEX
  #   value: workspace.grocery_copilot.supplier_knowledge_index
  - name: COPILOT_SERVING_ENDPOINT
    valueFrom: serving-endpoint
  # Optional: link from the "Which AI tool, when" card to the Genie space built by genie/build_space.py.
  # - name: GENIE_SPACE_URL
  #   value: https://<workspace>/genie/rooms/<space-id>
