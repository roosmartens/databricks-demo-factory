<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ demo.title }} · Customer story</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='story.css') }}">
    {{ theme_head("deck") }}
  </head>
  <body data-demo="{{ demo.key }}">
    <main class="deck-viewport" id="deck-viewport">
      <div class="deck-stage" id="deck-stage">

        {% include demo.deck_template %}

        <div class="stage-chrome" aria-hidden="true">
          <span class="chrome-brand"><i></i>Databricks</span>
          <span class="chrome-foot">FICTIONAL CUSTOMER · SYNTHETIC DATA</span>
          <span class="chrome-count"><b data-current>01</b> / <span data-total>00</span></span>
          <div class="chrome-progress"><i data-progress></i></div>
        </div>
      </div>
    </main>

    <nav class="nav-pill" aria-label="Presentation controls">
      <button type="button" data-prev aria-label="Previous slide">←</button>
      <button type="button" data-next aria-label="Next slide">→</button>
      <button type="button" data-print aria-label="Print">Print</button>
    </nav>

    <div class="edit-hotzone" aria-hidden="true"></div>
    <button class="edit-toggle" id="edit-toggle" type="button" aria-label="Toggle slide editing">✎</button>
    <div class="edit-toolbar" id="edit-toolbar" role="toolbar" aria-label="Edit tools">
      <span data-edit-status>EDIT MODE · CLICK ANY TEXT</span>
      <button type="button" data-save-edits>Save edits</button>
      <button type="button" data-export-html>Download HTML</button>
      <button type="button" data-reset-edits>Reset</button>
    </div>

    <script src="{{ url_for('static', filename='story.js') }}" defer></script>
  </body>
</html>
