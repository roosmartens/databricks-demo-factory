resources:
  pipelines:
    demand_pipeline:
      name: demand-planning-medallion
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      root_path: ../src/pipeline
      libraries:
        - glob:
            include: ../src/pipeline/transformations/**
      configuration:
        landing_path: /Volumes/${var.catalog}/${var.schema}/raw_demand/landing
