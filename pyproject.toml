[project]
name = "databricks-demo-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=22,<24",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

databricks = [
    "databricks-sdk>=0.50,<1",
    "databricks-sql-connector>=3.3,<5",
]

[tool.uv]
# cryptography 49 dropped macOS Intel wheels; 48.x has universal2 wheels, so Intel Macs avoid a Rust/OpenSSL build.
constraint-dependencies = ["cryptography<49"]

[tool.pytest.ini_options]
# pandas 2.3 builds Timedelta with NumPy's generic unit internally; NumPy 2.5 warns about it.
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
